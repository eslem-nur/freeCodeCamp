<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.ces">
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label for="name" id="name-label">Name</label> 
      <input type="text" id="name" placeholder="Enter your name" required>
      <label for="email" id="email-label">Email</label> 
      <input type="email" id="email" placeholder="Enter your email" required>
      <label for="number" id="number-label">Age(optional)</label>
      <input type="number" id="number" placeholder="Age" min="10" max="99">
      <label for="dropdown" id="dropdown-label"><br>Which option best describes your current role?</label>
      <select id="dropdown">
        <option value="">Select current role</option>
        <option value="student">Student current role</option>
        <option value="full-time-job">Full Time Job</option>
        <option value="full-time-learner">Full Time Learner</option>
        <option value="other">Other</option>
      </select>
      <fieldset>
        <legend>Would you recommend freeCodeCamp to a friend?</legend>
        <label>
          <input type="radio" name="recommend" value="definitely" checked> Definitely 
        </label>
        <label>
          <input type="radio" name="recommend" value="maybe"> Maybe
        </label>
        <label>
          <input type="radio" name="recommend" value="not-sure"> Not sure
        </label>
      </fieldset>
      <fieldset>
        <legend>What would you like to see improved? (Check all that apply)</legend>
        <label><input type="checkbox" value="front-end-projects"> Front-end Projects</label>
        <label><inpt type="checkbox" vale="back-end-projects"> Back-end Projects</label>
        <label><input type="checkbox" value="data-visualization"> Data Visualization</label>
        <label><input type="checkbox" value="challenges"> Challenges</label>
        <label><input type="checkbox" value="open-source-community"> Open Source Community</label>
      </fieldset>
      <label for="comments">Any comments or suggestions?</label>
      <textarea id="comments" placeholder="Enter your comment here..."></textarea>
      <button type="submit" id="submit">Submit</button>
      </input>
    </form>
  </body>
</html>
